name: Validate a proposed release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Proposed version tag
        required: true
        type: string
      commit:
        description: Full commit SHA to release
        required: true
        type: string

permissions:
  contents: read
  checks: read

jobs:
  validate-release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Validate before publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: scripts/validate-release.sh "$VERSION" "$RELEASE_COMMIT"
