name: Update runner dependencies

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-actions-runner
  cancel-in-progress: false

env:
  BASE_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  update:
    name: Check for a stable ${{ matrix.dependency }} update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dependency: actions-runner
            script: scripts/update_actions_runner.py
            files: deploy/compose.yaml runner/Dockerfile
            title: "chore(runner): update GitHub Actions runner to"
            verification: >-
              The updater selected the latest stable actions/runner release, verified
              both official Linux archives, and calculated their SHA-256 checksums.
          - dependency: buildx
            script: scripts/update_buildx.py
            files: runner/Dockerfile
            title: "chore(deps): update Docker Buildx to"
            verification: >-
              The updater used Docker's signed Debian trixie stable package indexes
              and verified both package downloads against their SHA-256 checksums.
              Hosted validation, managed build clients, and the runner image use
              the reviewed package version in runner/Dockerfile.
    env:
      UPDATE_BRANCH: automation/update-${{ matrix.dependency }}
      UPDATE_SCRIPT: ${{ matrix.script }}
      UPDATE_FILES: ${{ matrix.files }}
      TITLE_PREFIX: ${{ matrix.title }}
      VERIFICATION: ${{ matrix.verification }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test updater
        run: python3 scripts/test_update_actions_runner.py

      - name: Update dependency pins
        id: update
        run: python3 "$UPDATE_SCRIPT" --github-output "$GITHUB_OUTPUT"

      - name: Validate generated changes
        if: steps.update.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail
          git diff --check
          changed_file_list=$(git diff --name-only)
          mapfile -t changed_files <<<"$changed_file_list"
          read -ra expected_files <<<"$UPDATE_FILES"
          if [[ "${changed_files[*]}" != "${expected_files[*]}" ]]; then
            printf 'updater changed unexpected files: %s\n' "${changed_files[*]}" >&2
            exit 1
          fi
          python3 scripts/test_update_actions_runner.py

      - name: Commit and push deterministic update branch
        if: steps.update.outputs.changed == 'true'
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -Eeuo pipefail
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          read -ra expected_files <<<"$UPDATE_FILES"
          git add -- "${expected_files[@]}"
          git diff --cached --check
          git commit -m "$TITLE_PREFIX $VERSION"

          remote_sha=
          if git fetch --no-tags origin "refs/heads/${UPDATE_BRANCH}:refs/remotes/origin/${UPDATE_BRANCH}"; then
            remote_sha=$(git rev-parse "refs/remotes/origin/${UPDATE_BRANCH}")
          fi
          if [[ -n "$remote_sha" ]] && git diff --quiet "$remote_sha" HEAD; then
            printf 'pushed=false\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git push \
            --force-with-lease="refs/heads/${UPDATE_BRANCH}:${remote_sha}" \
            origin "HEAD:refs/heads/${UPDATE_BRANCH}"
          printf 'pushed=true\n' >>"$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.update.outputs.changed == 'true'
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -Eeuo pipefail
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          printf '%s\n' \
            "$VERIFICATION" \
            '' \
            'The engine documentation points to the pins. The configuration template needs no changes.' \
            '' \
            'Generated by .github/workflows/update-actions-runner.yml.' >"$body_file"

          pull_request_numbers=$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --json number \
              --jq '.[].number'
          )
          pull_requests=()
          if [[ -n "$pull_request_numbers" ]]; then
            mapfile -t pull_requests <<<"$pull_request_numbers"
          fi
          if (( ${#pull_requests[@]} > 1 )); then
            echo "more than one open updater pull request exists" >&2
            exit 1
          fi
          if (( ${#pull_requests[@]} == 0 )); then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "$TITLE_PREFIX $VERSION" \
              --body-file "$body_file"
            printf 'created=true\n' >>"$GITHUB_OUTPUT"
          else
            gh pr edit "${pull_requests[0]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE_PREFIX $VERSION" \
              --body-file "$body_file"
            printf 'created=false\n' >>"$GITHUB_OUTPUT"
          fi

      - name: Dispatch validation for the update head
        if: >-
          steps.update.outputs.changed == 'true' &&
          (steps.push.outputs.pushed == 'true' || steps.pull_request.outputs.created == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$UPDATE_BRANCH"
