name: Validate configuration

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: config-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hosted-validation:
    # Convenience only. Enabling this never changes host or required-check policy.
    if: ${{ vars.CI_FLEET_HOSTED_VALIDATION == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.state == 'open') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require independently pinned validator
        env:
          VALIDATOR: ${{ vars.CI_FLEET_VALIDATOR_REVISION }}
        run: '[[ "$VALIDATOR" =~ ^[0-9a-f]{40}$ ]]'

      - name: Check out trusted engine
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: RandomDevelopment/ci-fleet
          ref: ${{ vars.CI_FLEET_VALIDATOR_REVISION }}
          path: .ci-fleet-validator
          persist-credentials: false
          fetch-depth: 0

      - name: Install validation tools
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          sudo python3 -I .ci-fleet-validator/scripts/local_validation_executor.py --prepare --disposable-host

      - name: Run complete local configuration validation
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MAIN: ${{ github.event.pull_request.base.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
          VALIDATOR: ${{ vars.CI_FLEET_VALIDATOR_REVISION }}
        run: |
          args=()
          if [[ "$EVENT_NAME" == pull_request ]]; then args+=(--pr-title "$PR_TITLE"); fi
          sudo python3 .ci-fleet-validator/scripts/local_validate.py \
            --kind configuration --repository "$PWD" --source "$SOURCE" --base "$BASE" --main "$MAIN" \
            --policy-repository "$PWD/.ci-fleet-validator" --policy "$VALIDATOR" \
            --output "$RUNNER_TEMP/local-validation" "${args[@]}"
